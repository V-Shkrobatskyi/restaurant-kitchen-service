{% load cart_tags %}

<div id="dish-form-{{ dish.id }}"
     hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'>

  {% with qty=cart.quantity_map|get_item:dish.id|default:0 %}
    <div class="d-flex align-items-center justify-content-between border rounded p-1" style="min-width: 120px;">

      <button class="btn btn-sm btn-outline-danger mb-0 px-3"
              hx-post="{% url 'kitchen:table-update-cart' table.uuid dish.id 'decrease' %}"
              hx-target="#dish-form-{{ dish.id }}"
              hx-swap="outerHTML"
              {% if qty == 0 %}disabled{% endif %}>
          -
      </button>

      <span class="fw-bold px-1">{{ qty }}</span>

      <button class="btn btn-sm btn-outline-success mb-0 px-3"
              hx-post="{% url 'kitchen:table-update-cart' table.uuid dish.id 'add' %}"
              hx-target="#dish-form-{{ dish.id }}"
              hx-swap="outerHTML">
          +
      </button>

    </div>
  {% endwith %}
</div>
